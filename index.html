<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LCD Pano</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--color-1:#003135;--color-2:#024950;--color-3:#964734;--color-4:#0fa4af;--color-5:#afdde5;
--dark:#003135;--dark-rgb:0,49,53;--dark2:#024950;--dark2-rgb:2,73,80;--acc:#964734;--acc-rgb:150,71,52;--bright:#0fa4af;--bright-rgb:15,164,175;--light:#afdde5;--light-rgb:175,221,229;--on-mix:#fff}
:root{--bg:var(--dark2);--card:rgba(var(--light-rgb),.14);--ink:#f2fcfd;--mut:var(--light);--bd:rgba(var(--light-rgb),.38);--acc2:var(--light);--red:var(--acc);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:var(--dark2);--card:rgba(var(--light-rgb),.14);--ink:#f2fcfd;--mut:var(--light);--bd:rgba(var(--light-rgb),.38);--acc2:var(--light);--red:var(--acc)}}
:root[data-theme="dark"]{--bg:var(--dark2);--card:rgba(var(--light-rgb),.14);--ink:#f2fcfd;--mut:var(--light);--bd:rgba(var(--light-rgb),.38);--acc2:var(--light);--red:var(--acc)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background-color:var(--dark2);background-image:linear-gradient(120deg,var(--dark2),var(--bright),var(--dark2),var(--dark),var(--dark2));background-size:400% 400%;animation:flow 26s ease-in-out infinite alternate;color:var(--ink);font-family:Inter,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;text-shadow:0 1px 3px rgba(var(--dark-rgb),.55)}
body::before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(circle at 20% 30%,rgba(var(--light-rgb),.3),transparent 30%),radial-gradient(circle at 80% 70%,rgba(var(--acc-rgb),.4),transparent 32%),radial-gradient(circle at 60% 15%,rgba(var(--bright-rgb),.4),transparent 28%);animation:drift 22s ease-in-out infinite alternate}
@keyframes flow{from{background-position:0% 50%}to{background-position:100% 50%}}
@keyframes flowY{from{background-position:50% 0%}to{background-position:50% 100%}}
@keyframes drift{to{transform:translate(7%,5%) rotate(10deg) scale(1.12)}}
@keyframes bob{50%{transform:translateY(-.8vh) rotate(-3deg)}}
@keyframes pop{50%{transform:scale(1.05)}}
@keyframes bobc{to{transform:translateY(-.5vh);box-shadow:0 10px 20px rgba(var(--dark-rgb),.4)}}
@keyframes glow{from{box-shadow:0 0 18px rgba(var(--light-rgb),.5)}to{box-shadow:0 0 34px rgba(var(--bright-rgb),.75),0 0 64px rgba(var(--acc-rgb),.5)}}
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:28fr 50fr 22fr;grid-template-rows:13vh minmax(0,1fr) 12vh;gap:12px;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;overflow:hidden;min-height:0;display:flex;flex-direction:column;backdrop-filter:blur(8px);box-shadow:0 8px 28px rgba(var(--dark-rgb),.35)}
.top{grid-column:1/-1;flex-direction:row;align-items:center;gap:18px;padding:0 22px;border-color:rgba(var(--light-rgb),.6);background-image:linear-gradient(110deg,var(--dark2),var(--bright),var(--acc),var(--bright),var(--dark2));background-size:400% 100%;animation:flow 18s ease-in-out infinite alternate}
.top img{height:11vh;width:11vh;object-fit:contain;flex:none;filter:drop-shadow(0 4px 10px rgba(var(--dark-rgb),.5));animation:bob 4s ease-in-out infinite}
.top h1{margin:0;flex:1;font-size:clamp(16px,3.6vh,48px);font-weight:800;line-height:1.15;text-transform:uppercase;letter-spacing:.01em;color:#fff}
.clk{text-align:right;flex:none}
.clk span{display:block;color:var(--light);font-weight:700;font-size:clamp(11px,2.2vh,28px)}
.clk b{display:block;transform-origin:right center;font-size:clamp(28px,7vh,90px);line-height:1;font-weight:800;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 2px 12px rgba(var(--dark-rgb),.5);animation:pop 2s ease-in-out infinite}
.ch{padding:1.3vh 18px;font-weight:800;font-size:clamp(15px,2.8vh,32px);display:flex;align-items:center;gap:10px;flex:none;color:#fff}
.ch::before{content:"";width:8px;height:1.15em;border-radius:5px;background-image:linear-gradient(var(--light),var(--bright),var(--acc),var(--light));background-size:100% 400%;animation:flowY 4s ease-in-out infinite alternate}
.ch em{margin-left:auto;font-style:normal;font-weight:700;color:var(--dark);font-size:.7em;background:var(--light);padding:.15em .8em;border-radius:99px;text-shadow:none}
.dgrid{flex:1;overflow:auto;padding:4px 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.dc{--cc:var(--light);background:rgba(var(--dark-rgb),.4);border:1px solid var(--bd);border-left:7px solid var(--cc);border-radius:16px;padding:1.2vh 14px;animation:bobc 5s ease-in-out infinite alternate}
.dc:nth-child(5n+2){--cc:var(--bright);animation-delay:-1s}.dc:nth-child(5n+3){--cc:var(--acc);animation-delay:-2s}.dc:nth-child(5n+4){--cc:var(--light);animation-delay:-3s}.dc:nth-child(5n){--cc:var(--bright);animation-delay:-4s}
.dc small{display:block;color:var(--light);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(10px,1.6vh,18px)}
.dc b{display:block;margin-top:.5vh;font-weight:600;font-size:clamp(13px,2.2vh,26px);line-height:1.35;color:#fff}
.slider{position:relative;perspective:1600px;background:#000;display:block;border:2px solid rgba(var(--light-rgb),.7);animation:glow 5s ease-in-out infinite alternate}
.slide{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain;background:#000;animation:sin 1s ease both;backface-visibility:hidden}
.slide.out{animation:sout 1s ease both}
@keyframes sin{from{opacity:0;transform:rotateY(80deg) scale(.9)}to{opacity:1;transform:none}}
@keyframes sout{to{opacity:0;transform:rotateY(-80deg) scale(.9)}}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--light);text-align:center;padding:20px;font-size:clamp(14px,2.4vh,28px)}
.info{margin:0 14px 10px;padding:1.3vh 12px;text-align:center;line-height:1.5;flex:none;font-size:clamp(13px,2.2vh,26px);font-weight:600;color:var(--on-mix);border-radius:16px;border:1px solid rgba(var(--light-rgb),.7);background-image:linear-gradient(120deg,var(--acc),var(--bright),var(--acc));background-size:300% 100%;animation:flow 8s ease-in-out infinite alternate}
.info b{background:var(--dark);color:var(--light);padding:0 .4em;border-radius:.4em;text-shadow:none}
.list{flex:1;overflow:auto}
.lr{--c:var(--bright);display:flex;justify-content:space-between;align-items:center;padding:.9vh 18px;font-size:clamp(12px,2vh,24px);border-bottom:1px solid var(--bd);border-left:6px solid var(--c);color:#fff}
.lr:nth-child(3n+2){--c:var(--acc)}.lr:nth-child(3n){--c:var(--light)}
.lr span{background:var(--light);color:var(--dark);padding:.1em .8em;border-radius:99px;font-weight:800;text-transform:uppercase;text-shadow:none}
.lr span:empty{display:none}
.tk{grid-column:1/-1;border-radius:22px;border:1px solid rgba(var(--light-rgb),.7);background-image:linear-gradient(100deg,var(--acc),var(--dark2),var(--bright),var(--dark2),var(--acc));background-size:300% 100%;animation:flow 10s ease-in-out infinite alternate;color:#fff;font-weight:800;text-transform:uppercase;text-shadow:0 2px 8px rgba(var(--dark-rgb),.6);display:flex;align-items:center;overflow:hidden;white-space:nowrap;font-size:clamp(24px,7vh,100px)}
.tk span{display:inline-block;padding-left:100%;animation:mq 30s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
.pr{display:flex;align-items:center;gap:10px;padding:6px 8px;border:1px solid var(--bd);border-radius:10px;margin:4px 0}.pr b{width:1.6em;text-align:center}.pr .pt{width:56px;height:36px;border-radius:6px;background:var(--dark);display:grid;place-items:center;overflow:hidden;flex:none}.pr .pt img{width:100%;height:100%;object-fit:cover}.pr em{flex:1;font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pr button{border:0;border-radius:6px;background:var(--bd);color:#fff;padding:4px 9px;cursor:pointer}
.lcol{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:12px;min-height:0}
.qcard{max-height:42vh;border-color:rgba(var(--light-rgb),.65);background-image:linear-gradient(120deg,rgba(var(--acc-rgb),.7),rgba(var(--bright-rgb),.55),rgba(var(--acc-rgb),.7));background-size:300% 100%;animation:flow 14s ease-in-out infinite alternate}
.qb{position:relative;padding:.2vh 18px 1.6vh;overflow:hidden}
.qm{position:absolute;right:14px;top:-1.6vh;font-size:10vh;line-height:1;font-family:Georgia,serif;color:rgba(var(--light-rgb),.4)}
.qb p{margin:0 0 .9vh;font-size:clamp(13px,2.3vh,28px);line-height:1.4;font-weight:600;color:#fff}
.qcard.long .qb p{font-size:clamp(12px,1.9vh,22px)}
.qb small{display:block;text-align:right;font-weight:800;color:var(--light);font-size:clamp(11px,1.8vh,22px)}
.qcard.qin .qb{animation:qin 1s ease both}
@keyframes qin{from{opacity:0;transform:translateY(2vh)}to{opacity:1;transform:none}}
.sw{display:flex;gap:6px;margin:8px 0 4px}.sw span{flex:1;height:28px;border-radius:8px;border:1px solid var(--bd)}
.tools{position:fixed;right:18px;bottom:6px;display:flex;gap:6px;opacity:.25;transition:.2s;z-index:5}.tools:hover{opacity:1}
.tools button{background:#333;color:#fff;border:0;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:16px}
dialog{width:min(920px,94vw);max-height:90vh;border:0;border-radius:16px;background:var(--dark2);text-shadow:none;color:var(--ink);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:18px 0 6px}
label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
input,textarea,select{width:100%;background:var(--dark);color:var(--ink);border:1px solid var(--bd);border-radius:8px;padding:7px;font:inherit}
.tb{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:3px;font-size:13px;text-align:left}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.th{display:flex;flex-wrap:wrap;gap:8px}.th div{position:relative}.th img{height:64px;border-radius:6px;display:block}
.th button{position:absolute;top:2px;right:2px;border:0;border-radius:50%;background:var(--red);color:#fff;width:20px;height:20px;cursor:pointer;line-height:1}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn{border:0;border-radius:8px;padding:9px 18px;cursor:pointer;font:inherit;background:var(--bd);color:var(--ink)}.btn.p{background:var(--acc);color:#fff}
@media (max-width:900px){body{overflow:auto}.app{height:auto;min-height:100%;grid-template-columns:1fr;grid-template-rows:none}.top{grid-column:1}.top{padding:8px 14px;flex-wrap:wrap}.top img{height:64px;width:64px}.slider{height:46vh}.tk{grid-column:1;height:12vh}.lcol{grid-template-rows:none}.qcard{max-height:none}}
</style>
</head>

function bell(){
  const n=new Date(),d=n.getDay(),t=n.getHours()*60+n.getMinutes()+n.getSeconds()/60,m=Math.ceil;
  if(d===0||d===6)return{li:-1,msg:'Bugün ders yok.'};
  const L=lessonList();
  if(!L.length)return{li:-1,msg:'Zil programı girilmemiş.'};
  if(t<L[0].s)return{li:L[0].i,msg:`Ders başlangıcına <b>${m(L[0].s-t)} dakika</b> var.`};
  for(let k=0;k<L.length;k++){
    const c=L[k],nx=L[k+1];
    if(t>=c.s&&t<c.e)return{li:c.i,msg:`Şu an <b>${c.i+1}.</b> dersteyiz.<br>`+(nx?(c.lunch?`Öğle arasına <b>${m(c.e-t)} dakika</b> var.`:`Teneffüs ziline <b>${m(c.e-t)} dakika</b> var.`):`Ders çıkışına <b>${m(c.e-t)} dakika</b> var.`)};
    if(nx&&t>=c.e&&t<nx.s)return{li:nx.i,msg:(c.lunch?'Şu an öğle arasındasınız.':'Şu an teneffüstesiniz.')+`<br><b>${nx.i+1}.</b> ders ziline <b>${m(nx.s-t)} dakika</b> var.`};
  }

}

    fails=0;
  }else{
    let b;try{b=await dbGet(it.id)}catch(e){}
    if(my!==tok)return;if(!b)return bad();
    const u=URL.createObjectURL(b);
    if(it.type==='vid'){
      n=document.createElement('video');n.muted=!S.sound;n.playsInline=true;n.autoplay=true;n.loop=one;n.onended=adv;n.onerror=bad;n.onloadeddata=()=>{fails=0};
      n.src=u;n.dataset.u=u;
    }else{
      n=document.createElement('img');n.alt='';n.onerror=bad;n.onload=()=>{fails=0};n.src=u;n.dataset.u=u;
      if(!one)ptimer=setTimeout(adv,Math.max(2,S.sec)*1000);
    }
  }
  n.className='slide';
  const old=pcur;pcur=n;el.querySelector('.empty')?.remove();el.appendChild(n);
  if(it.type==='vid')n.play().catch(()=>{n.muted=true;n.play().catch(()=>{})});
  if(old){old.classList.add('out');setTimeout(()=>leave(old),1000)}
}
const ICO={vid:'🎞️',yt:'▶️',img:'🖼️'};
function plHTML(){
  return (S.playlist||[]).map((it,i)=>`<div class="pr"><b>${i+1}</b><span class="pt" data-th="${it.id}">${ICO[it.type]}</span><em title="${esc(it.name)}">${esc(it.name)}${it.type==='yt'?' (YouTube)':it.type==='vid'?' (video)':''}</em><button data-up="${i}" title="Yukarı">▲</button><button data-dn="${i}" title="Aşağı">▼</button><button data-rm="${i}" title="Sil">×</button></div>`).join('')||'<small>Liste boş.</small>';
}

function renderAll(){
  $('#school').textContent=S.school;document.title=S.school+' · LCD Pano';
  const t=$('#tk');t.textContent=S.ticker;t.style.animationDuration=Math.max(15,S.ticker.length*.3)+'s';
  renderDuty();renderLessons();renderSlides();
}
function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const w=Math.min(1280,i.width),h=i.height*w/i.width,c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);c.toBlob(r,'image/jpeg',.72)};i.onerror=()=>r(null);i.src=URL.createObjectURL(f)})}
const opt=v=>'<option value=""></option>'+(v&&!S.teachers.includes(v)?[...S.teachers,v]:S.teachers).map(t=>`<option ${t===v?'selected':''}>${esc(t)}</option>`).join('');

function form(){
  const b=S.bell,days=[1,2,3,4,5],dd=S.duty[curDay]||[];
  let dt='<table><tr><th>Nöbet yeri</th><th>1. öğretmen</th><th>2. öğretmen</th></tr>'+S.places.map((p,i)=>{const v=names(dd[i]).concat(['','']);return `<tr><td>${esc(p)}</td><td><select data-i="${i}" data-s="0">${opt(v[0])}</select></td><td><select data-i="${i}" data-s="1">${opt(v[1])}</select></td></tr>`}).join('')+'</table>';
  let tt='<table><tr><th></th>'+days.map(d=>`<th>${DS[d]}</th>`).join('')+'</tr>';
  for(let l=0;l<11;l++)tt+=`<tr><td>${l+1}.</td>`+days.map(d=>`<td><input data-l="${l}" data-td="${d}" value="${esc(S.tt[cur]?.[d]?.[l])}"></td>`).join('')+'</tr>';
  tt+='</table>';
  $('#form').innerHTML=`<h2 style="margin:0">Ayarlar</h2>
  <label>Okul adı</label><input id="f-school" value="${esc(S.school)}">
  <label>Kayan yazı</label><textarea id="f-tk" rows="2">${esc(S.ticker)}</textarea>
  <label style="display:flex;gap:8px;align-items:center"><input id="f-sound" type="checkbox" style="width:auto" ${S.sound?'checked':''}> Videolar sesli oynasın (tarayıcı engellerse sessiz oynar)</label>
    <label>Görsel geçiş süresi (sn)</label><input id="f-sec" type="number" min="2" max="60" value="${S.sec}">
  <h3>Renk paleti</h3>
  ${palHTML()}
  <small>Seçim anında önizlenir, Kaydet'e basınca kalıcı olur. “Otomatik” seçiliyken palet her gece değişir.</small>
  <h3>Zil programı</h3>
  <small>En fazla 11 ders. Kullanmayacağınız satırın saatlerini silip boş bırakın. Teneffüs süresi, derslerin saatlerinden otomatik hesaplanır (5 dk, 10 dk, farklı olabilir). "Öğle" kutusunu işaretlediğiniz dersten sonraki ara öğle arası sayılır.</small>
  <div class="tb" style="margin-top:8px"><table><tr><th>Ders</th><th>Başlangıç</th><th>Bitiş</th><th>Sonraki ara</th><th>Öğle arası</th></tr>${bellRows()}</table></div>
  <h3>Nöbetçi öğretmenler</h3>
  <label>Öğretmen listesi (her satıra bir ad soyad)</label><textarea class="rf" id="f-teach" rows="5">${esc(S.teachers.join('\n'))}</textarea>
  <label>Nöbet yerleri (her satıra bir yer)</label><textarea class="rf" id="f-places" rows="4">${esc(S.places.join('\n'))}</textarea>
  <label>Nöbet günü</label><select class="rf" id="f-day">${days.map(d=>`<option value="${d}" ${d===curDay?'selected':''}>${DF[d]}</option>`).join('')}</select>
  <div class="tb" style="margin-top:8px">${dt}</div>
  <h3>Ders programı</h3>
  <label>Sınıflar (her satıra bir sınıf)</label><textarea class="rf" id="f-classes" rows="4">${esc(S.classes.join('\n'))}</textarea>
  <label>Düzenlenen sınıf</label><select class="rf" id="f-cur">${S.classes.map(c=>`<option ${c===cur?'selected':''}>${esc(c)}</option>`).join('')}</select>
  <div class="tb" style="margin-top:8px">${tt}</div>
  <h3>Slayt alanı: görsel ve videolar</h3>
  <small>Liste yukarıdan aşağıya sırayla oynar. Video bitince, görsel süresi dolunca sonrakine geçilir; son öğeden sonra başa dönülür.</small>
  <div id="pl">${plHTML()}</div>
  <label>Bilgisayardan görsel veya video ekle</label><input id="f-img" type="file" accept="image/*,video/*" multiple>
  <label>YouTube bağlantısı ekle</label><div style="display:flex;gap:8px"><input id="f-yt" placeholder="https://www.youtube.com/watch?v=..."><button class="btn" id="f-ytadd" type="button">Ekle</button></div>
  <div class="acts"><button class="btn" id="f-cancel">Kapat</button><button class="btn p" id="f-save">Kaydet</button></div>`;
  document.querySelectorAll('.rf').forEach(e=>e.onchange=()=>{const v=e.value,id=e.id;collect();if(id==='f-cur')cur=v;if(id==='f-day')curDay=+v;form()});
  $('#f-img').onchange=async e=>{collect();for(const f of e.target.files){try{const v=f.type.startsWith('video/'),id=uid(),b=v?f:await shrink(f);if(!b)throw new Error('dosya okunamadı');await dbPut(id,b);added.push(id);S.playlist.push({id,type:v?'vid':'img',name:f.name})}catch(er){alert(f.name+' eklenemedi: '+(er.message||er))}}form()};
  $('#f-ytadd').onclick=()=>{collect();const u=$('#f-yt').value.trim();if(!ytId(u)){alert('Geçerli bir YouTube bağlantısı girin.');return}S.playlist.push({id:uid(),type:'yt',name:'YouTube: '+ytId(u),url:u});form()};
  document.querySelectorAll('[data-up]').forEach(x=>x.onclick=()=>{collect();const i=+x.dataset.up;if(i>0)[S.playlist[i-1],S.playlist[i]]=[S.playlist[i],S.playlist[i-1]];form()});
  document.querySelectorAll('[data-dn]').forEach(x=>x.onclick=()=>{collect();const i=+x.dataset.dn;if(i<S.playlist.length-1)[S.playlist[i+1],S.playlist[i]]=[S.playlist[i],S.playlist[i+1]];form()});
  document.querySelectorAll('[data-bs],[data-be]').forEach(x=>x.oninput=updGaps);updGaps();
  $('#f-pal').onchange=e=>{palet.use(e.target.value);updSw()};updSw();
  thumbU.forEach(u=>URL.revokeObjectURL(u));thumbU=[];
  S.playlist.forEach(async it=>{if(it.type!=='img')return;try{const b=await dbGet(it.id),el=document.querySelector(`[data-th="${it.id}"]`);if(!b||!el)return;const u=URL.createObjectURL(b);thumbU.push(u);el.innerHTML=`<img src="${u}" alt="">`}catch(e){}});
  document.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{collect();const[it]=S.playlist.splice(+x.dataset.rm,1);if(it&&it.type!=='yt')removed.push(it.id);form()});
    $('#f-cancel').onclick=()=>{added.forEach(dbDel);added=[];removed=[];load();$('#dlg').close();renderAll()};
  $('#f-save').onclick=()=>{collect();save();removed.forEach(dbDel);removed=[];added=[];$('#dlg').close();renderAll()};
}
function collect(){
  S.school=$('#f-school').value.trim()||'LCD Pano';S.ticker=$('#f-tk').value;S.sound=$('#f-sound').checked;S.palet=$('#f-pal').value;S.sec=+$('#f-sec').value||8;
  S.bell={times:[...Array(11).keys()].map(i=>({s:$(`[data-bs="${i}"]`).value,e:$(`[data-be="${i}"]`).value,lunch:$(`[data-bl="${i}"]`).checked}))};
  document.querySelectorAll('[data-s]').forEach(x=>{const a=(S.duty[curDay]=S.duty[curDay]||[]),i=+x.dataset.i;a[i]=names(a[i]).length?a[i].concat(['','']).slice(0,2):['',''];a[i][+x.dataset.s]=x.value});
  document.querySelectorAll('[data-l]').forEach(i=>{const d=i.dataset.td;((S.tt[cur]=S.tt[cur]||{})[d]=S.tt[cur][d]||[])[+i.dataset.l]=i.value});
  const L=id=>$(id).value.split('\n').map(x=>x.trim()).filter(Boolean);
  S.teachers=L('#f-teach');S.places=L('#f-places');S.classes=L('#f-classes');
  if(!S.classes.includes(cur))cur=S.classes[0];
}
$('#dlg').addEventListener('close',()=>{if(window.palet)palet.use(S.palet||'auto')});
$('#set').onclick=()=>{added=[];removed=[];form();$('#dlg').showModal()};
$('#fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})};
addEventListener('keydown',e=>{
  if($('#dlg').open||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  if(e.key==='f'||e.key==='F')$('#fs').click();
  if(e.key==='s'||e.key==='S')$('#set').click();
});
load();clock();migrate().catch(()=>{}).finally(renderAll);
setInterval(clock,1000);setInterval(renderLessons,1000);setInterval(renderDuty,60000);
</script>

<script>
/* Günlük palet rotasyonu — her gece 00:00'da bir sonraki palete geçer (7 günlük döngü) */
(()=>{
  const PALETTES=[
    ['#003135','#024950','#964734','#0fa4af','#afdde5'],
    ['#0B132B','#1C2541','#48CAE4','#90E0EF','#F72585'],
    ['#1B2A22','#324A3D','#588157','#A3B18A','#D4A373'],
    ['#0D1B2A','#1B263B','#415A77','#E0E1DD','#E07A5F'],
    ['#070F18','#132238','#1EA896','#4CB99F','#F2A541'],
    ['#2B2D42','#8D99AE','#3A86EF','#4CC9F0','#F77F00'],
    ['#0F1020','#242642','#3B82F6','#60A5FA','#A855F7']
  ];
  /* Sayfadaki roller: [koyu, koyu2, vurgu, parlak, açık] → palet içindeki renk sırası (0 tabanlı) */
  const ROLES=[[0,1,2,3,4],[0,1,4,2,3],[0,1,4,2,3],[0,1,4,2,3],[0,1,4,2,3],[0,2,4,3,1],[0,1,4,2,3]];
  const NAMES=['dark','dark2','acc','bright','light'];
  const START='2026-10-02';            /* bu tarihte 1. palet aktif olur; sonraki günler sırayla ilerler */
  const root=document.documentElement;
  const [sy,sm,sd]=START.split('-').map(Number),base=Date.UTC(sy,sm-1,sd)/864e5;
  let sim=null,forced=null,cur=-1;
  const now=()=>sim?new Date(sim+'T12:00:00'):new Date();
  const dayNo=d=>Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
  const todayIdx=()=>(((dayNo(now())-base)%7)+7)%7;
  const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const lum=h=>{const[r,g,b]=rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
  const cr=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
  function apply(i,why){
    const p=PALETTES[i],r=ROLES[i];
    p.forEach((c,k)=>root.style.setProperty('--color-'+(k+1),c));
    r.forEach((idx,k)=>{root.style.setProperty('--'+NAMES[k],p[idx]);root.style.setProperty('--'+NAMES[k]+'-rgb',rgb(p[idx]).join(','))});
    const dk=p[r[0]],ac=p[r[2]],br=p[r[3]],w=ink=>Math.min(cr(ink,ac),cr(ink,br));
    root.style.setProperty('--on-mix',w('#ffffff')>=w(dk)?'#ffffff':dk);
    cur=i;console.log(`[Palet] Aktif: ${i+1}/7 (${why}) → ${p.join(', ')}`);
  }
  function check(){if(forced!==null)return;const i=todayIdx();if(i!==cur)apply(i,'otomatik, '+now().toLocaleDateString('tr-TR'))}
  function schedule(){const n=new Date(),next=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1,0,0,1);setTimeout(()=>{check();schedule()},next-n)}
  /* Test / manuel kontrol: konsoldan palet.set(3), palet.simulate('2026-10-08'), palet.auto(), palet.info() */
  window.palet={
    set(n){forced=((n-1)%7+7)%7;apply(forced,'manuel')},
    simulate(d){sim=d||null;forced=null;check();if(d)console.log('[Palet] Simüle edilen tarih:',d)},
    auto(){forced=null;sim=null;cur=-1;check()},
    colors:PALETTES,today:todayIdx,current:()=>cur,
    use(v){if(!v||v==='auto'){forced=null;sim=null;cur=-1;check()}else{forced=((+v-1)%7+7)%7;apply(forced,'ayarlardan seçildi')}},
    info(){console.table(PALETTES.map((p,i)=>({palet:i+1,aktif:i===cur?'●':'',renkler:p.join(' ')})));return cur+1}
  };
  const q=new URLSearchParams(location.search);          /* ?palet=3  veya  ?tarih=2026-10-08 */
  if(q.get('tarih'))sim=q.get('tarih');
  const saved=(typeof S!=='undefined'&&S&&S.palet)||'auto';
  if(q.get('palet')){forced=((+q.get('palet')-1)%7+7)%7;apply(forced,'URL parametresi')}
  else if(saved!=='auto'){forced=((+saved-1)%7+7)%7;apply(forced,'ayarlardan seçildi')}
  else check();
  schedule();setInterval(check,20000);
  document.addEventListener('visibilitychange',check);
  addEventListener('keydown',e=>{               /* P: sonraki paleti önizle, Shift+P: otomatiğe dön */
    if(document.getElementById('dlg')?.open||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
    if(e.key==='P')window.palet.auto();
    else if(e.key==='p')window.palet.set((cur+1)%7+1);
  });
})();
</script>
